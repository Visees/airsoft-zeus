<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AirsoftHub</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e100f;
        color: #e9ece6;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #a9b0a6;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 4px;
        background: #a4b465;
        color: #121509;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- Shown by the app when the site can't be reached (server.errorPath in capacitor.config.ts). -->
    <main>
      <h1 id="title">No connection</h1>
      <p id="text">AirsoftHub can't reach the server. Check your signal or Wi-Fi and try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      if (/^it\b/i.test(navigator.language)) {
        document.documentElement.lang = 'it';
        document.getElementById('title').textContent = 'Nessuna connessione';
        document.getElementById('text').textContent = 'AirsoftHub non riesce a raggiungere il server. Controlla il segnale o il Wi-Fi e riprova.';
        document.getElementById('retry').textContent = 'Riprova';
      }
      // Going back reloads the page that failed to load.
      document.getElementById('retry').addEventListener('click', () => history.back());
    </script>
  </body>
</html>
